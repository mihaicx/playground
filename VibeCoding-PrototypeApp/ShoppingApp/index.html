<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse fresh fruit, manage your shopping cart, and try a mock checkout."
    />
    <title>Fruit Shop</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#/products" aria-label="Fruit Shop home">
          <span class="brand-mark" aria-hidden="true">FS</span>
          <span class="brand-name">Fruit Shop</span>
        </a>
        <nav class="navigation" aria-label="Pages">
          <a class="nav-link" href="#/products" data-page="products">
            <span class="nav-short" aria-hidden="true">P</span>
            <span class="nav-label">Products</span>
          </a>
          <a class="nav-link" href="#/product-details" data-page="product-details">
            <span class="nav-short" aria-hidden="true">PD</span>
            <span class="nav-label">ProductDetails</span>
          </a>
          <a class="nav-link" href="#/shopping-cart" data-page="shopping-cart">
            <span class="nav-short" aria-hidden="true">SC</span>
            <span class="nav-label">ShoppingCart</span>
            <span class="cart-badge" id="cart-count">0</span>
          </a>
          <a class="nav-link" href="#/checkout" data-page="checkout">
            <span class="nav-short" aria-hidden="true">C</span>
            <span class="nav-label">Checkout</span>
          </a>
        </nav>
      </aside>
      <main class="main-content" id="main-content" tabindex="-1"></main>
    </div>
  </body>
</html>
